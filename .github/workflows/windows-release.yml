name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
    outputs:
      release-url:
        description: URL for the created GitHub release
        value: ${{ jobs.release.outputs.release-url }}

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate semantic version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use a version such as v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi

  build:
    name: Build and test Windows app
    needs: validate-tag
    uses: ./.github/workflows/windows-build.yml

  release:
    name: Create GitHub release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-url: ${{ steps.release.outputs.release-url }}

    steps:
      - name: Download tested Windows application
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/Expedite

      - name: Package release archive
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          archive="Expedite-${RELEASE_TAG}-windows.zip"
          (cd dist && zip -r "$archive" Expedite)
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "Expedite $RELEASE_TAG" \
            --generate-notes
          url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          echo "release-url=$url" >> "$GITHUB_OUTPUT"
