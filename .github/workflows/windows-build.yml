name: Build Windows

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Optional installer version; defaults to pyproject.toml
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Optional installer version; defaults to pyproject.toml
        required: false
        type: string
        default: ""
    outputs:
      artifact-id:
        description: GitHub artifact ID for the Windows build
        value: ${{ jobs.build-windows.outputs.artifact-id }}
      artifact-url:
        description: URL for the Windows build artifact
        value: ${{ jobs.build-windows.outputs.artifact-url }}
      artifact-digest:
        description: SHA-256 digest for the Windows onedir artifact
        value: ${{ jobs.build-windows.outputs.artifact-digest }}
      installer-artifact-id:
        description: GitHub artifact ID for the Windows installer
        value: ${{ jobs.build-windows.outputs.installer-artifact-id }}
      installer-artifact-url:
        description: URL for the Windows installer artifact
        value: ${{ jobs.build-windows.outputs.installer-artifact-url }}
      installer-artifact-digest:
        description: SHA-256 digest for the Windows installer artifact
        value: ${{ jobs.build-windows.outputs.installer-artifact-digest }}
      installer-filename:
        description: Filename of the Windows installer
        value: ${{ jobs.build-windows.outputs.installer-filename }}

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Test and build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      installer-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
      installer-artifact-url: ${{ steps.upload-installer.outputs.artifact-url }}
      installer-artifact-digest: ${{ steps.upload-installer.outputs.artifact-digest }}
      installer-filename: ${{ steps.version.outputs.installer-filename }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Determine installer version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          [string] $version = $env:REQUESTED_VERSION
          $version = $version.Trim()
          if (-not $version) {
            $version = uv run python -c `
              "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          }
          $version = $version.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Installer version must use a value such as 0.1.0 or 0.1.0-rc.1."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer-filename=Expedite-$version-Windows-Setup.exe" >> $env:GITHUB_OUTPUT

      - name: Run quality checks
        run: |
          uv run ruff check .
          uv run ty check
          uv run pytest

      - name: Build Windows onedir application
        run: >-
          uv run pyinstaller
          --noconfirm
          --clean
          --workpath build/pyinstaller
          --distpath dist
          build/expedite-windows.spec

      - name: Add Windows launchers
        shell: pwsh
        run: Copy-Item "build/Run Expedite*.cmd" "dist/Expedite/"

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Expedite/Expedite.exe")) {
            throw "Windows executable was not generated."
          }
          foreach ($launcher in @("Run Expedite.cmd", "Run Expedite Diagnostics.cmd")) {
            if (-not (Test-Path (Join-Path "dist/Expedite" $launcher))) {
              throw "Windows launcher was not generated: $launcher"
            }
          }
          $sourceRuntime = uv run python -c `
            "from pathlib import Path; import pythonnet; print(Path(pythonnet.__file__).parent / 'runtime')"
          $packagedRuntime = "dist/Expedite/_internal/pythonnet/runtime"
          $missingRuntimeFiles = @()
          foreach ($sourceFile in Get-ChildItem $sourceRuntime -File) {
            $packagedFile = Join-Path $packagedRuntime $sourceFile.Name
            if (-not (Test-Path $packagedFile)) {
              $missingRuntimeFiles += $sourceFile.Name
            }
          }
          if ($missingRuntimeFiles.Count -gt 0) {
            throw "Missing pythonnet runtime files: $($missingRuntimeFiles -join ', ')"
          }
          Write-Host "Verified all $((Get-ChildItem $sourceRuntime -File).Count) pythonnet runtime files."
          Get-ChildItem "dist/Expedite" -Recurse |
            Measure-Object -Property Length -Sum |
            Select-Object Count, Sum

      - name: Upload Windows application
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: expedite-windows
          path: dist/Expedite/
          if-no-files-found: error
          retention-days: 14

      - name: Build per-user Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_FILENAME: ${{ steps.version.outputs.installer-filename }}
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "build/windows/expedite.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }
          $installer = Join-Path "dist/installer" $env:INSTALLER_FILENAME
          if (-not (Test-Path $installer)) {
            throw "Windows installer was not generated: $installer"
          }
          Get-FileHash $installer -Algorithm SHA256

      - name: Upload Windows installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: expedite-windows-installer
          path: dist/installer/${{ steps.version.outputs.installer-filename }}
          if-no-files-found: error
          retention-days: 14

      - name: Install application silently for smoke test
        shell: pwsh
        env:
          INSTALLER_FILENAME: ${{ steps.version.outputs.installer-filename }}
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP "ExpediteInstalled"
          Remove-Item $installDirectory -Recurse -Force -ErrorAction SilentlyContinue
          $diagnosticDirectory = Join-Path $env:GITHUB_WORKSPACE "build/diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          $installLog = Join-Path $diagnosticDirectory "inno-install.log"
          $installer = Join-Path "dist/installer" $env:INSTALLER_FILENAME
          $installerProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$installDirectory",
              "/LOG=$installLog"
            ) `
            -Wait `
            -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "Windows installer exited with code $($installerProcess.ExitCode)."
          }
          if (-not (Test-Path (Join-Path $installDirectory "Expedite.exe"))) {
            throw "Installed Expedite executable was not found."
          }
          $runtimeDll = Join-Path $installDirectory "_internal/pythonnet/runtime/Python.Runtime.dll"
          $zoneIdentifier = Get-Item $runtimeDll -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($zoneIdentifier) {
            throw "Installed Python.Runtime.dll retained an Internet-origin marker."
          }
          "EXPEDITE_TEST_INSTALL_DIR=$installDirectory" >> $env:GITHUB_ENV

      - name: Smoke-test installed application
        shell: pwsh
        run: |
          $diagnosticDirectory = Join-Path $env:GITHUB_WORKSPACE "build/diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          $env:EXPEDITE_DIAGNOSTIC_LOG_DIR = $diagnosticDirectory
          $env:EVENT_INTAKE_DATA_DIR = Join-Path $env:RUNNER_TEMP "ExpediteSmokeData"
          $windowMarker = Join-Path $diagnosticDirectory "native-window-shown"
          Remove-Item $windowMarker -ErrorAction SilentlyContinue
          $installedExecutable = Join-Path $env:EXPEDITE_TEST_INSTALL_DIR "Expedite.exe"
          $startupTimer = [System.Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process `
            -FilePath $installedExecutable `
            -ArgumentList @(
              "--diagnostic",
              "--port", "8765",
              "--smoke-test-marker", $windowMarker
            ) `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged application exited during startup with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8765/" `
                  -UseBasicParsing `
                  -TimeoutSec 1
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Packaged application did not serve its home page within 60 seconds."
            }

            # The HTTP server can be healthy even when pywebview or the NiceGUI
            # handshake fails. Require the marker written after the ready window is shown.
            $windowShown = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Native window process failed after server startup (exit code $($process.ExitCode))."
              }
              if (Test-Path $windowMarker) {
                $windowShown = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $windowShown) {
              throw "Native window did not become interactive within 30 seconds."
            }
            $startupTimer.Stop()
            $startupSeconds = $startupTimer.Elapsed.TotalSeconds
            Write-Host "Native startup reached interactive state in $startupSeconds seconds."
            if ($startupSeconds -gt 15) {
              throw "Native startup exceeded the 15-second performance budget."
            }
            Write-Host "Packaged HTTP server and interactive native window are healthy."
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
            $uninstaller = Join-Path $env:EXPEDITE_TEST_INSTALL_DIR "unins000.exe"
            if (Test-Path $uninstaller) {
              $uninstallProcess = Start-Process `
                -FilePath $uninstaller `
                -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
                -Wait `
                -PassThru
              if ($uninstallProcess.ExitCode -ne 0) {
                Write-Warning "Uninstaller exited with code $($uninstallProcess.ExitCode)."
              }
            }
            $logPath = Join-Path $diagnosticDirectory "expedite-diagnostic.log"
            if (Test-Path $logPath) {
              Get-Content $logPath
            }
          }

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expedite-windows-diagnostics
          path: build/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
