[project]
name = "expedite"
version = "0.1.0"
description = "Desktop app for event order intake, CSV export, and 4x6 label image generation"
readme = "README.md"
authors = [
    { name = "John Myrda", email = "hello@johnmyrda.com" }
]
requires-python = ">=3.11"
dependencies = [
    "nicegui[native]>=3.16.0",
    "phonenumbers>=9.0.37",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
]

[project.scripts]
expedite = "expedite.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
