name: Build and release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
    outputs:
      artifact-id:
        description: GitHub artifact ID for the Windows build
        value: ${{ jobs.build-windows.outputs.artifact-id }}
      artifact-url:
        description: URL for the Windows build artifact
        value: ${{ jobs.build-windows.outputs.artifact-url }}
      artifact-digest:
        description: SHA-256 digest for the Windows build artifact
        value: ${{ jobs.build-windows.outputs.artifact-digest }}
      release-url:
        description: URL for the created GitHub release
        value: ${{ jobs.build-windows.outputs.release-url }}

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Test and build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      release-url: ${{ steps.release.outputs.release-url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run quality checks
        run: |
          uv run ruff check .
          uv run ty check
          uv run pytest

      - name: Build Windows onedir application
        run: >-
          uv run pyinstaller
          --noconfirm
          --clean
          --workpath build/pyinstaller
          --distpath dist
          build/expedite-windows.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Expedite/Expedite.exe")) {
            throw "Windows executable was not generated."
          }
          Get-ChildItem "dist/Expedite" -Recurse |
            Measure-Object -Property Length -Sum |
            Select-Object Count, Sum

      - name: Package release archive
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use a version such as v0.1.0 or v0.1.0-rc.1."
          }
          $archive = "dist/Expedite-$($env:RELEASE_TAG)-windows.zip"
          Compress-Archive -Path "dist/Expedite" -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload Windows application
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: expedite-windows
          path: dist/Expedite/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create $env:RELEASE_TAG $env:RELEASE_ARCHIVE `
            --target $env:GITHUB_SHA `
            --title "Expedite $env:RELEASE_TAG" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
          $url = gh release view $env:RELEASE_TAG --json url --jq .url
          "release-url=$url" >> $env:GITHUB_OUTPUT
