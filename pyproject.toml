[project]
name = "expedite"
version = "0.1.0"
description = "Desktop app for event order intake, SQLite-backed storage, and thermal receipt-label image generation"
readme = "README.md"
authors = [
    { name = "John Myrda", email = "hello@johnmyrda.com" }
]
requires-python = ">=3.11"
dependencies = [
    "nicegui[native]>=3.16.0",
    "phonenumbers==9.0.38",
    "pillow>=12.3.0",
    "pydantic==2.13.5",
    "pywin32>=311 ; sys_platform == 'win32'",
    "sqlmodel==0.0.42",
]

[project.scripts]
expedite = "expedite.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "live: launches the NiceGUI preview and a real browser",
]

[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Run Ruff lint checks" }
types = { cmd = "ty check", help = "Run type checks" }
test = { cmd = "pytest tests", help = "Run the test suite" }
check = { sequence = ["lint", "types", "test"], help = "Run all quality checks" }

[tool.poe.tasks.build-mac]
help = "Build the macOS application (append --clean for a release build)"
cmd = """
pyinstaller --noconfirm --workpath build/pyinstaller --distpath dist
build/expedite.spec
"""

[tool.poe.tasks.build-windows]
help = "Build the Windows application (append --clean for a release build)"
cmd = """
pyinstaller --noconfirm --workpath build/pyinstaller --distpath dist
build/expedite-windows.spec
"""

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pyinstaller==6.22.2",
    "pytest>=9.1.1",
    "ruff==0.16.5",
    "ty==0.0.75",
]
