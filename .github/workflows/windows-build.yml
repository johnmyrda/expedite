name: Build Windows

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        description: GitHub artifact ID for the Windows build
        value: ${{ jobs.build-windows.outputs.artifact-id }}
      artifact-url:
        description: URL for the Windows build artifact
        value: ${{ jobs.build-windows.outputs.artifact-url }}
      artifact-digest:
        description: SHA-256 digest for the Windows build artifact
        value: ${{ jobs.build-windows.outputs.artifact-digest }}

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Test and build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run quality checks
        run: |
          uv run ruff check .
          uv run ty check
          uv run pytest

      - name: Build Windows onedir application
        run: >-
          uv run pyinstaller
          --noconfirm
          --clean
          --workpath build/pyinstaller
          --distpath dist
          build/expedite-windows.spec

      - name: Add diagnostic launcher
        shell: pwsh
        run: Copy-Item "build/Run Expedite Diagnostics.cmd" "dist/Expedite/"

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Expedite/Expedite.exe")) {
            throw "Windows executable was not generated."
          }
          if (-not (Test-Path "dist/Expedite/Run Expedite Diagnostics.cmd")) {
            throw "Windows diagnostic launcher was not generated."
          }
          $sourceRuntime = uv run python -c `
            "from pathlib import Path; import pythonnet; print(Path(pythonnet.__file__).parent / 'runtime')"
          $packagedRuntime = "dist/Expedite/_internal/pythonnet/runtime"
          $missingRuntimeFiles = @()
          foreach ($sourceFile in Get-ChildItem $sourceRuntime -File) {
            $packagedFile = Join-Path $packagedRuntime $sourceFile.Name
            if (-not (Test-Path $packagedFile)) {
              $missingRuntimeFiles += $sourceFile.Name
            }
          }
          if ($missingRuntimeFiles.Count -gt 0) {
            throw "Missing pythonnet runtime files: $($missingRuntimeFiles -join ', ')"
          }
          Write-Host "Verified all $((Get-ChildItem $sourceRuntime -File).Count) pythonnet runtime files."
          Get-ChildItem "dist/Expedite" -Recurse |
            Measure-Object -Property Length -Sum |
            Select-Object Count, Sum

      - name: Upload Windows application
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: expedite-windows
          path: dist/Expedite/
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $diagnosticDirectory = Join-Path $env:GITHUB_WORKSPACE "build/diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          $env:EXPEDITE_DIAGNOSTIC_LOG_DIR = $diagnosticDirectory
          $env:EVENT_INTAKE_DATA_DIR = Join-Path $env:RUNNER_TEMP "ExpediteSmokeData"
          $windowMarker = Join-Path $diagnosticDirectory "native-window-shown"
          Remove-Item $windowMarker -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath "dist/Expedite/Expedite.exe" `
            -ArgumentList @(
              "--diagnostic",
              "--port", "8765",
              "--smoke-test-marker", $windowMarker
            ) `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged application exited during startup with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8765/" `
                  -UseBasicParsing `
                  -TimeoutSec 1
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Packaged application did not serve its home page within 60 seconds."
            }

            # The HTTP server can be healthy even when pywebview fails. Require the
            # event emitted only after the native Windows window is actually shown.
            $windowShown = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Native window process failed after server startup (exit code $($process.ExitCode))."
              }
              if (Test-Path $windowMarker) {
                $windowShown = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $windowShown) {
              throw "Native window did not emit its shown event within 30 seconds."
            }
            Write-Host "Packaged HTTP server and native window are healthy."
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
            $logPath = Join-Path $diagnosticDirectory "expedite-diagnostic.log"
            if (Test-Path $logPath) {
              Get-Content $logPath
            }
          }

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expedite-windows-diagnostics
          path: build/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
